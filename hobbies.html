<!doctype html>
<!-- Author: Rui Heng Yang -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hobbies · Rui Heng Yang</title>
  <meta name="description" content="Hobbies of Rui Heng Yang: photography, postcards, and fridge magnets.">
  <link rel="canonical" href="https://rhyang6.github.io/hobbies.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch { /* storage blocked: use system theme */ }
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-label="Dark mode">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="track"><span class="knob"></span></span>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
  <main>
    <header>
      <h1>Hobbies</h1>
      <p class="contact"><a href="index.html">&larr; Rui Heng Yang</a></p>
    </header>

    <section>
      <p>
        Outside of research, I enjoy photography. I collect a stamped postcard from every city I visit, and my
        fridge is slowly filling up with magnets from the same trips.
      </p>
      <p class="note">Photos coming soon.</p>
    </section>

    <footer>Last updated October 2026</footer>
  </main>
  <script>
    // Same theme switch as the main page (main.js), without the publication rendering.
    const toggle = document.querySelector("#theme-toggle");
    const label = () => { toggle.setAttribute("aria-checked", String(document.documentElement.dataset.theme === "dark")); };
    toggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      label();
      try { localStorage.setItem("theme", next); } catch { /* storage blocked: theme just won't persist */ }
    });
    label();
  </script>
</body>
</html>
